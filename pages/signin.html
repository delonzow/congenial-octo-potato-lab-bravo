<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeBox | Sign In</title>
    <link rel="stylesheet" href="../assets/styles/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-sm navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">RecipeBox</a>
            <div class="navbar-nav">
                <a class="nav-link" href="../index.html">Home</a>
                <a class="nav-link active" href="signin.html">Sign in</a>
                <a class="nav-link" href="admin.html">Admin</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-6 col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h1 class="h4 mb-0">Sign in to RecipeBox</h1>
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="mb-3">
                                <label for="username" class="form-label">Username or email</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="pwd-box" name="password" required>
                            </div>
                            <button type="button" id="signin-btn" class="btn btn-primary w-100">Sign in</button>
                            <p id="message" class="mt-3 mb-0" role="status"></p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="border-top py-4 text-center text-muted">
        <a href="https://github.com/delonzow" target="_blank" rel="noopener noreferrer" class="me-3">GitHub profile</a>
        <a href="https://github.com/delonzow/congenial-octo-potato-lab-bravo" target="_blank" rel="noopener noreferrer">Source code</a>
    </footer>

    <script src="../assets/scripts/app.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
</body>
</html>
