<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>RecipeBox | Admin</title>
        <link rel="stylesheet" href="../assets/styles/styles.css" />
    </head>
    <body>
        <nav class="navbar navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand fw-bold" href="../index.html">RecipeBox</a>
                <div class="navbar-nav flex-row gap-3">
                    <a class="nav-link" href="../index.html">Home</a>
                    <a class="nav-link" href="signin.html">Sign in</a>
                </div>
            </div>
        </nav>

        <main class="container py-4">
            <h1 class="h3 mb-4">Admin dashboard</h1>

            <div class="card mb-4">
                <div class="card-body">
                    <h2 class="h5">Recipe management</h2>
                    <p class="text-muted">Signed in as admin.</p>
                    <button type="button" class="btn btn-primary">Add recipe</button>
                    <button type="button" class="btn btn-outline-secondary">Sign out</button>
                </div>
            </div>

            <div class="card">
                <div class="card-header">Recipes</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Toll House Chocolate Chip Cookies
                        <button type="button" class="btn btn-sm btn-outline-danger">Delete</button>
                    </li>
                </ul>
            </div>
        </main>

        <footer class="border-top py-4 text-center text-muted">
            <a href="https://github.com/delonzow" target="_blank">GitHub profile</a>
        </footer>
    </body>
</html>
